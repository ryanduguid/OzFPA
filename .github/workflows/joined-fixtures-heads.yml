name: Joined fixtures at companion heads

# joined-fixtures.yml pins both companions and gates merges. This weekly run
# joins this repository's main with both companions' main, so drift between
# the 3 heads shows up before a pin moves. It gates nothing: no branch
# protection rule or release check names this workflow.
on:
  schedule:
    - cron: "41 6 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  companion-heads:
    name: companion-heads (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    timeout-minutes: 20
    steps:
      # All 3 repositories at main: this repository from the scheduled or
      # dispatched revision, both companions from their default branch.
      - name: Check out accounting-review-pipeline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryanduguid/accounting-review-pipeline
          ref: main
          path: sources/accounting-review-pipeline
          persist-credentials: false
      - name: Check out au-fpa-pack
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: sources/au-fpa-pack
          persist-credentials: false
      - name: Check out australian-accounting
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ryanduguid/australian-accounting
          ref: main
          path: sources/australian-accounting
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.13.5'
          enable-cache: false
      - name: Verify the public fixture workflows
        shell: bash
        run: bash sources/au-fpa-pack/.github/ci/joined-fixtures.sh run
      - name: Summarise fixture results
        if: ${{ !cancelled() }}
        shell: bash
        run: bash sources/au-fpa-pack/.github/ci/joined-fixtures.sh summary
      - name: Retain fabricated results and failure diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: companion-heads-fixtures-${{ matrix.os }}
          path: ${{ runner.temp }}/public-fixtures/*/results/
          if-no-files-found: warn
          retention-days: 7
